name: Fix summaries to chapters 15-21

on:
  push:
    branches:
      - fix-chapters-15-21

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-chapters-15-21

      - name: Remove chapters 08-14 from summaries
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')

          start = text.index('const chapters08to21 = [')
          end = text.index('] as const;', start) + len('] as const;')
          block = text[start:end]
          first_keep = block.index('  {\n    number: "15"')
          replacement = 'const chapters15to21 = [\n' + block[first_keep:]
          text = text[:start] + replacement + text[end:]

          text = text.replace(
              'Os capítulos 08 a 21, reunidos para seguir acompanhando a história.',
              'Os capítulos 15 a 21, reunidos para seguir acompanhando a história.'
          )
          text = text.replace('Capítulos 08–21', 'Capítulos 15–21')
          text = text.replace('chapters08to21.map', 'chapters15to21.map')

          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/fix-chapters-15-21.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/fix-chapters-15-21.yml
          git commit -m "fix: show only chapters 15 through 21"
          git push origin fix-chapters-15-21
